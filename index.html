<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fffaf0"><title>Little Learning Garden</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Learning Garden">
<!-- Font attribution: Free HK Kai 4700 v1.01, Free Hong Kong Fonts project. CC BY 4.0 https://creativecommons.org/licenses/by/4.0/ . Source: https://github.com/freehkfonts/freehkkai . Derived subset/WOFF; glyph outlines unmodified. -->
<style id="gate-css">
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f1e3;font-family:system-ui,-apple-system,'PingFang TC',sans-serif;color:#244c46}
#gate{background:#fffaf0;border-radius:28px;padding:34px 30px;width:min(420px,88vw);text-align:center;box-shadow:0 10px 40px #0001}
#gate h1{font-size:26px;margin:8px 0 2px}#gate p{margin:4px 0 18px;color:#5d6f63}#gate .big{font-size:64px;line-height:1}
#gate #showrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:16px;color:#5d6f63}
#gate #show{width:22px;height:22px;margin:0}
#gate #pw{width:100%;box-sizing:border-box;font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid #cfd8c4;background:#fff;color:#244c46}
#gate button{margin-top:14px;width:100%;font-size:22px;font-weight:800;padding:14px;border:0;border-radius:18px;background:#23695d;color:#fff;cursor:pointer}
#gate button:disabled{opacity:.6}#gate #msg{min-height:24px;margin-top:12px;font-weight:700}#gate #msg.bad{color:#b4442f}
#gate input:focus-visible,#gate button:focus-visible{outline:4px solid #cd922d;outline-offset:2px}#gate [hidden]{display:none}
</style></head><body>
<main id="gate"><div class="big">🌱</div><h1>Little Learning Garden</h1><p>小小學習樂園 · 家庭密碼 Family password</p>
<form id="f" hidden><label for="pw" style="position:absolute;left:-9999px">Password 密碼</label>
<input id="pw" name="password" type="password" inputmode="text" enterkeyhint="go" placeholder="Tap here · 按這裡輸入密碼" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label id="showrow"><input id="show" type="checkbox"> Show password 顯示密碼</label>
<button id="go" type="submit">Enter 進入</button></form><div id="msg" role="status">Loading… 載入中</div><p style="margin:18px 0 0;font-size:12px;color:#8a9a8f">© 2026 SKYLEONG. All rights reserved.</p></main>
<script>
(async function(){
'use strict';
const VER="14.11",$=id=>document.getElementById(id),msg=(t,bad)=>{const m=$('msg');if(m){m.textContent=t;m.className=bad?'bad':''}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),toB64=u=>{let t='';for(let i=0;i<u.length;i++)t+=String.fromCharCode(u[i]);return btoa(t)};
if(!window.crypto||!crypto.subtle){msg('This page needs a secure (https) connection. 需要 https 連線。',true);return}
let key=null,meta;
async function useKey(raw){key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12)},key,u.subarray(12))}
async function get(name){const r=await fetch('d/'+name+'.bin');if(!r.ok)throw new Error('net');return dec(await r.arrayBuffer())}
const text=b=>new TextDecoder().decode(b);
async function check(){try{await dec(b64(meta.check).buffer);return true}catch(e){return false}}
async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(meta.salt),iterations:meta.iter,hash:'SHA-256'},km,256))}
async function boot(){
  msg('Opening the garden… 正在打開樂園');
  const plan=JSON.parse(text(await get('boot')));let done=0;
  const parts=await Promise.all(plan.steps.map(s=>s.f?get(s.f).then(b=>{done++;msg(`Loading 載入中 ${done}/${plan.steps.length}`);return text(b)}):Promise.resolve(s.code)));
  window.LLG_GET=name=>get(name);
  window.LLG_LOCK=()=>{try{localStorage.removeItem('llg_k')}catch(e){}location.reload()};
  const gateCss=$('gate-css');
  plan.steps.forEach((s,i)=>{
    if(s.t==='css'){const el=document.createElement('style');if(s.id)el.id=s.id;el.textContent=parts[i];document.head.appendChild(el)}
    else if(s.t==='html'){if(gateCss)gateCss.remove();document.body.removeAttribute('style');document.title=plan.title;document.documentElement.lang='zh-Hant';document.body.innerHTML=parts[i]}
    else{const el=document.createElement('script');el.textContent=parts[i];document.body.appendChild(el)}});
  if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(reg=>{if(reg.active)reg.active.postMessage({keep:plan.steps.filter(s=>s.f).map(s=>'d/'+s.f+'.bin').concat(['d/boot.bin','d/meta.json'])})}).catch(()=>{});
}
try{meta=await fetch('d/meta.json',{cache:'no-cache'}).then(r=>r.json())}catch(e){msg('Cannot load. Check the internet connection. 載入失敗，請檢查網絡。',true);return}
let saved=null;try{saved=localStorage.getItem('llg_k')}catch(e){}
if(saved){try{await useKey(b64(saved));if(await check()){try{await boot()}catch(e){msg('Cannot load. Check the internet connection. 載入失敗，請檢查網絡。',true)}return}}catch(e){}}
msg('');$('f').hidden=false;
$('show').addEventListener('change',e=>{$('pw').type=e.target.checked?'text':'password'});
$('f').addEventListener('submit',async e=>{e.preventDefault();$('go').disabled=true;msg('Checking… 檢查中');
  try{const raw=await derive($('pw').value);await useKey(raw);
    if(!(await check())){msg('Wrong password. 密碼不正確。',true);$('go').disabled=false;return}
    try{localStorage.setItem('llg_k',toB64(raw))}catch(e){}
    $('f').hidden=true;await boot()}
  catch(err){msg('Cannot load. Check the internet connection. 載入失敗，請檢查網絡。',true);$('go').disabled=false}});
})();
</script></body></html>
